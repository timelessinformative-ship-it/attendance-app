[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['npm install -g pnpm@latest', 'pnpm install --frozen-lockfile']

[phases.build]
cmds = [
  'BASE_PATH=/ pnpm --filter @workspace/attendance-app run build',
  'pnpm --filter @workspace/api-server run build'
]

[start]
cmd = 'NODE_ENV=production node artifacts/api-server/dist/index.mjs'
